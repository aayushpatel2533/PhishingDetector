<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Phishing Detector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #00ff88;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .header p {
            color: #888;
            font-size: 1.1rem;
        }

        .scanner-box {
            background: linear-gradient(145deg, #0a0a0a, #1a1a1a);
            border: 2px solid #00ff88;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            color: #00ff88;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            background-color: #0a0a0a;
            border: 2px solid #333;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        .scan-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            border: none;
            border-radius: 8px;
            color: #000000;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .scan-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.4);
        }

        .scan-button:active {
            transform: translateY(0);
        }

        .scan-button:disabled {
            background: #333;
            cursor: not-allowed;
            transform: none;
        }

        .result-card {
            margin-top: 30px;
            padding: 30px;
            background: #0a0a0a;
            border-radius: 10px;
            border: 2px solid #333;
            display: none;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-card.show {
            display: block;
        }

        .result-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .result-status {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .result-status.phishing {
            color: #ff3333;
            text-shadow: 0 0 20px rgba(255, 51, 51, 0.5);
        }

        .result-status.legitimate {
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .result-url {
            color: #888;
            font-size: 0.9rem;
            word-break: break-all;
            margin-top: 10px;
        }

        .result-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .metric {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .metric-label {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: bold;
            color: #00ff88;
        }

        .loading {
            text-align: center;
            color: #00ff88;
            margin-top: 20px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #333;
            border-top: 3px solid #00ff88;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #ff3333;
            color: #ffffff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 2rem;
            }

            .scanner-box {
                padding: 25px;
            }

            .result-metrics {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ AI Phishing Detector</h1>
            <p>Protect yourself from malicious URLs</p>
        </div>

        <div class="scanner-box">
            <div class="input-group">
                <label for="urlInput">Enter URL to Scan</label>
                <input 
                    type="text" 
                    id="urlInput" 
                    placeholder="https://example.com"
                    autocomplete="off"
                >
            </div>

            <button class="scan-button" id="scanButton">
                Scan URL
            </button>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Analyzing URL...</p>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <div class="result-card" id="resultCard">
                <div class="result-header">
                    <div class="result-status" id="resultStatus"></div>
                    <div class="result-url" id="resultUrl"></div>
                </div>

                <div class="result-metrics">
                    <div class="metric">
                        <div class="metric-label">Model Confidence</div>
                        <div class="metric-value" id="confidenceValue">-</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Phishing Probability</div>
                        <div class="metric-value" id="riskScoreValue">-</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const scanButton = document.getElementById('scanButton');
        const loading = document.getElementById('loading');
        const resultCard = document.getElementById('resultCard');
        const errorMessage = document.getElementById('errorMessage');
        const resultStatus = document.getElementById('resultStatus');
        const resultUrl = document.getElementById('resultUrl');
        const confidenceValue = document.getElementById('confidenceValue');
        const riskScoreValue = document.getElementById('riskScoreValue');

        // Scan button click handler
        scanButton.addEventListener('click', scanUrl);

        // Enter key handler
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                scanUrl();
            }
        });

        async function scanUrl() {
            const url = urlInput.value.trim();

            // Validate input
            if (!url) {
                showError('Please enter a URL');
                return;
            }

            // Hide previous results and errors
            resultCard.classList.remove('show');
            errorMessage.classList.remove('show');

            // Show loading
            loading.classList.add('show');
            scanButton.disabled = true;

            try {
                // Call the prediction API
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                // Hide loading
                loading.classList.remove('show');
                scanButton.disabled = false;

                if (response.ok) {
                    // Display results
                    displayResults(data);
                } else {
                    // Show error
                    showError(data.error || 'An error occurred');
                }
            } catch (error) {
                loading.classList.remove('show');
                scanButton.disabled = false;
                showError('Failed to connect to the server');
            }
        }

        function displayResults(data) {
            // Set status
            resultStatus.textContent = data.prediction;
            resultStatus.className = 'result-status ' + 
                (data.prediction === 'PHISHING' ? 'phishing' : 'legitimate');

            // Set URL
            resultUrl.textContent = data.url;

            // Set metrics
            confidenceValue.textContent = data.confidence + '%';
            riskScoreValue.textContent = data.risk_score + '%';

            // Update risk score color based on value
            if (data.risk_score > 70) {
                riskScoreValue.style.color = '#ff3333';
            } else if (data.risk_score > 40) {
                riskScoreValue.style.color = '#ffaa00';
            } else {
                riskScoreValue.style.color = '#00ff88';
            }

            // Show result card
            resultCard.classList.add('show');
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }
    </script>
</body>
</html>
